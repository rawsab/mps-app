<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/web-app-manifest-192x192.png" />
    <link rel="apple-touch-icon" href="/web-app-manifest-192x192.png" />
    <title>Modern Physique Systems</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash (see src/lib/theme.ts).
      (function () {
        var t = null;
        try { t = localStorage.getItem('mps-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F6F5F1');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
